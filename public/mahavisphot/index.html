<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahavisphot Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090f;
        --bg2: #10141d;
        --panel: #171b26;
        --panel2: #202636;
        --line: #333b50;
        --line2: #4b5875;
        --text: #f1f5fb;
        --muted: #a6afc2;
        --cyan: #25d0df;
        --violet: #9c7cff;
        --amber: #f0bd58;
        --emerald: #49db8d;
        --rose: #f05d76;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(37, 208, 223, .07) 1px, transparent 1px),
          linear-gradient(0deg, rgba(156, 124, 255, .05) 1px, transparent 1px),
          radial-gradient(circle at 22% 12%, rgba(37, 208, 223, .18), transparent 34%),
          radial-gradient(circle at 78% 3%, rgba(240, 189, 88, .13), transparent 31%),
          var(--bg);
        background-size: 44px 44px, 44px 44px, auto, auto, auto;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar {
        min-height: 58px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 13, 20, .9);
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      .mark {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--rose);
        box-shadow: 0 0 18px rgba(240, 93, 118, .9);
      }

      .brand strong {
        font-size: 15px;
        letter-spacing: .04em;
        white-space: nowrap;
      }

      .mode {
        color: var(--muted);
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      .nav a,
      .route-pill,
      .button {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #242838, #161925);
        border-radius: 5px;
        padding: 8px 12px;
        font-size: 11px;
        color: var(--text);
      }

      .nav a[aria-current="page"],
      .button.primary {
        border-color: rgba(37, 208, 223, .95);
        background: linear-gradient(180deg, rgba(37, 208, 223, .28), rgba(37, 208, 223, .12));
        color: #dffcff;
        box-shadow: 0 0 0 1px rgba(37, 208, 223, .12) inset;
      }

      .actions {
        justify-content: end;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      .shell {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        min-height: calc(100vh - 58px);
      }

      aside {
        border-right: 1px solid var(--line);
        background: rgba(12, 15, 23, .72);
        padding: 14px;
      }

      .side-title {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        margin: 4px 0 10px;
      }

      .route-list {
        display: grid;
        gap: 6px;
      }

      .route-pill {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
      }

      .route-pill span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--emerald);
        flex: 0 0 auto;
      }

      .route-pill[aria-current="page"] {
        border-color: var(--cyan);
        background: rgba(37, 208, 223, .12);
      }

      main {
        min-width: 0;
        padding: clamp(18px, 3vw, 38px);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
        gap: 22px;
        align-items: stretch;
      }

      .hero-copy,
      .visual,
      .status-strip,
      .module-tile,
      .rail-panel,
      .launch-panel {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(27, 32, 46, .94), rgba(10, 12, 19, .94));
        border-radius: 7px;
      }

      .hero-copy {
        padding: clamp(22px, 4vw, 44px);
        min-height: 420px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 7vw, 92px);
        line-height: .92;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 820px;
        color: var(--muted);
        font-size: clamp(15px, 1.7vw, 20px);
        line-height: 1.48;
        margin: 18px 0 0;
      }

      .honesty {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        max-width: 660px;
        margin-top: 28px;
        border: 1px solid rgba(240, 189, 88, .72);
        color: var(--amber);
        background: rgba(240, 189, 88, .08);
        border-radius: 5px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.45;
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .visual {
        position: relative;
        overflow: hidden;
        min-height: 420px;
      }

      .visual img {
        width: 100%;
        height: 100%;
        min-height: 420px;
        object-fit: cover;
        display: block;
        filter: saturate(1.08) contrast(1.03);
      }

      .visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 9, 15, .22), transparent 34%, rgba(7, 9, 15, .5)),
          linear-gradient(180deg, transparent 52%, rgba(7, 9, 15, .85));
        pointer-events: none;
      }

      .visual-label {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        border: 1px solid rgba(37, 208, 223, .42);
        background: rgba(8, 11, 17, .78);
        border-radius: 5px;
        padding: 10px 12px;
        font-size: 11px;
      }

      .chip {
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 4px 8px;
        color: var(--muted);
        white-space: nowrap;
      }

      .chip.scaffold {
        color: var(--cyan);
        border-color: rgba(37, 208, 223, .62);
      }

      .chip.blocked {
        color: var(--rose);
        border-color: rgba(240, 93, 118, .62);
      }

      .chip.preview {
        color: var(--amber);
        border-color: rgba(240, 189, 88, .62);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .module-tile {
        min-height: 158px;
        padding: 12px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 10px;
      }

      .module-tile img {
        width: 100%;
        height: 84px;
        object-fit: cover;
        border: 1px solid rgba(37, 208, 223, .18);
        border-radius: 4px;
        background: #04060b;
      }

      .module-head,
      .status-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .module-head strong {
        font-size: 13px;
      }

      .module-meta {
        color: var(--muted);
        font-size: 10px;
      }

      .studio-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
        gap: 14px;
        margin-top: 18px;
      }

      .rail-panel {
        padding: 14px;
        min-height: 190px;
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .track {
        height: 26px;
        border: 1px solid rgba(75, 88, 117, .8);
        background: #0e111a;
        position: relative;
        border-radius: 4px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        top: 4px;
        bottom: 4px;
        border-radius: 3px;
        border: 1px solid rgba(37, 208, 223, .5);
        background: linear-gradient(90deg, rgba(37, 208, 223, .38), rgba(156, 124, 255, .28));
      }

      .node-map {
        min-height: 210px;
        position: relative;
        margin-top: 14px;
        border: 1px solid rgba(75, 88, 117, .7);
        border-radius: 5px;
        background:
          linear-gradient(90deg, rgba(75, 88, 117, .18) 1px, transparent 1px),
          linear-gradient(0deg, rgba(75, 88, 117, .18) 1px, transparent 1px),
          #0b0e16;
        background-size: 32px 32px;
      }

      .node {
        position: absolute;
        min-width: 112px;
        border: 1px solid rgba(37, 208, 223, .55);
        border-radius: 5px;
        padding: 8px;
        background: #171b26;
        font-size: 10px;
      }

      .node:nth-child(2) {
        border-color: rgba(240, 189, 88, .55);
      }

      .node:nth-child(3) {
        border-color: rgba(73, 219, 141, .55);
      }

      .meter-row {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 7px;
        height: 120px;
        align-items: end;
        margin-top: 14px;
      }

      .meter {
        border-radius: 3px 3px 0 0;
        background: linear-gradient(180deg, var(--rose), var(--amber) 35%, var(--emerald) 72%, var(--cyan));
        min-height: 18px;
      }

      .widget-board {
        display: grid;
        grid-template-columns: minmax(0, 1.18fr) minmax(270px, .82fr);
        gap: 14px;
        margin-top: 18px;
      }

      .widget-panel {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(27, 32, 46, .96), rgba(10, 12, 19, .96));
        border-radius: 7px;
        padding: 14px;
        min-width: 0;
      }

      .widget-toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 12px;
      }

      .widget-button {
        border: 1px solid var(--line2);
        background: #161b27;
        color: var(--text);
        border-radius: 5px;
        padding: 7px 10px;
        font: inherit;
        font-size: 10px;
        cursor: pointer;
      }

      .widget-button[aria-pressed="true"],
      .widget-button:focus-visible {
        border-color: var(--cyan);
        color: var(--cyan);
        outline: none;
      }

      .range-row {
        display: grid;
        grid-template-columns: minmax(88px, 120px) minmax(0, 1fr) 46px;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }

      .range-row input[type="range"] {
        width: 100%;
        accent-color: var(--cyan);
      }

      .widget-stage {
        min-height: 300px;
        border: 1px solid rgba(75, 88, 117, .7);
        border-radius: 6px;
        margin-top: 12px;
        overflow: hidden;
        position: relative;
        background:
          linear-gradient(90deg, rgba(75, 88, 117, .18) 1px, transparent 1px),
          linear-gradient(0deg, rgba(75, 88, 117, .18) 1px, transparent 1px),
          radial-gradient(circle at 50% 46%, rgba(37, 208, 223, .16), transparent 38%),
          #080b12;
        background-size: 32px 32px, 32px 32px, auto, auto;
      }

      .reference-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }

      .reference-strip img {
        width: 100%;
        height: 78px;
        object-fit: cover;
        border: 1px solid rgba(37, 208, 223, .2);
        border-radius: 4px;
        background: #05070d;
      }

      .particle-field {
        --spread: 62%;
        --lift: 46%;
        --size: 7px;
      }

      .particle {
        position: absolute;
        left: calc(50% + (var(--px) * var(--spread)));
        top: calc(50% + (var(--py) * var(--lift)));
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 14px currentColor;
        color: var(--cyan);
        transform: translate(-50%, -50%) scale(var(--scale));
        transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease, color .2s ease;
      }

      .particle-field[data-preset="ash"] .particle {
        color: #d5e2e8;
        background: #d5e2e8;
      }

      .particle-field[data-preset="embers"] .particle {
        color: var(--amber);
        background: var(--amber);
      }

      .particle-field[data-preset="energy"] .particle {
        color: var(--emerald);
        background: var(--emerald);
      }

      .gizmo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150px;
        height: 150px;
        border: 1px solid rgba(37, 208, 223, .45);
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(var(--zoom, 1));
      }

      .gizmo::before,
      .gizmo::after {
        content: "";
        position: absolute;
        background: var(--cyan);
      }

      .gizmo::before {
        left: 50%;
        top: -42px;
        bottom: -42px;
        width: 2px;
      }

      .gizmo::after {
        top: 50%;
        left: -42px;
        right: -42px;
        height: 2px;
      }

      .face-mesh {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150px;
        height: 190px;
        border: 1px solid rgba(37, 208, 223, .7);
        border-radius: 48% 48% 44% 44%;
        transform: translate(-50%, -50%) scale(var(--mesh-scale, 1));
        background:
          radial-gradient(circle at 36% 39%, var(--cyan) 0 3px, transparent 4px),
          radial-gradient(circle at 64% 39%, var(--cyan) 0 3px, transparent 4px),
          linear-gradient(90deg, transparent 49%, rgba(37, 208, 223, .55) 50%, transparent 51%),
          linear-gradient(0deg, transparent 32%, rgba(37, 208, 223, .28) 33%, transparent 34%, transparent 58%, rgba(37, 208, 223, .28) 59%, transparent 60%);
      }

      .scope-field {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 12px;
        align-items: stretch;
      }

      .scope-lines {
        position: relative;
        min-height: 210px;
        border: 1px solid rgba(75, 88, 117, .7);
        border-radius: 5px;
        background:
          linear-gradient(0deg, rgba(240, 189, 88, .16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(75, 88, 117, .16) 1px, transparent 1px),
          #070a10;
        background-size: 100% 22px, 34px 100%;
        overflow: hidden;
      }

      .scope-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 42px;
        background: linear-gradient(90deg, transparent, rgba(240, 93, 118, .4), rgba(73, 219, 141, .46), rgba(37, 208, 223, .44), transparent);
        filter: blur(4px);
        transform: translateY(var(--wave));
      }

      .vector-disc {
        width: 180px;
        min-height: 180px;
        border-radius: 50%;
        border: 1px solid rgba(156, 124, 255, .55);
        background:
          radial-gradient(circle, rgba(241, 245, 251, .72) 0 4%, transparent 5%),
          conic-gradient(from 0deg, rgba(240, 93, 118, .32), rgba(240, 189, 88, .3), rgba(73, 219, 141, .32), rgba(37, 208, 223, .32), rgba(156, 124, 255, .32), rgba(240, 93, 118, .32));
        position: relative;
      }

      .vector-disc::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 72px;
        height: 118px;
        border-radius: 48%;
        background: rgba(241, 245, 251, .72);
        transform: translate(-50%, -50%) rotate(var(--vec-rot, -22deg));
        filter: blur(3px);
      }

      .queue-list,
      .asset-cards,
      .check-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .queue-row,
      .asset-card,
      .check-row {
        border: 1px solid rgba(75, 88, 117, .68);
        background: rgba(12, 15, 23, .7);
        border-radius: 5px;
        padding: 9px 10px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        font-size: 11px;
      }

      .progress {
        height: 7px;
        border-radius: 999px;
        background: #0a0d14;
        overflow: hidden;
        margin-top: 6px;
      }

      .progress span {
        display: block;
        height: 100%;
        width: var(--pct);
        background: linear-gradient(90deg, var(--cyan), var(--emerald));
      }

      .mini-track-label {
        color: var(--muted);
        font-size: 10px;
        margin-top: 11px;
      }

      .interactive-clip {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: var(--left);
        width: var(--width);
        min-width: 42px;
        border-radius: 3px;
        border: 1px solid rgba(37, 208, 223, .72);
        background: linear-gradient(90deg, rgba(37, 208, 223, .48), rgba(156, 124, 255, .42));
        cursor: grab;
      }

      .interactive-clip:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      .thumb-ref {
        border: 1px solid rgba(75, 88, 117, .75);
        border-radius: 5px;
        overflow: hidden;
        background: #05070d;
      }

      .thumb-ref img {
        width: 100%;
        height: 130px;
        object-fit: cover;
        display: block;
      }

      .thumb-ref div {
        padding: 8px;
        color: var(--muted);
        font-size: 10px;
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .inventory-card {
        border: 1px solid rgba(75, 88, 117, .72);
        background: rgba(12, 15, 23, .7);
        border-radius: 6px;
        padding: 12px;
      }

      .inventory-card span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
      }

      .inventory-card strong {
        display: block;
        margin-top: 6px;
        font-size: 24px;
      }

      .inventory-section {
        margin-top: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(27, 32, 46, .96), rgba(10, 12, 19, .96));
        border-radius: 7px;
        padding: 14px;
      }

      .inventory-section h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0;
      }

      .inventory-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        font-size: 11px;
      }

      .inventory-table th,
      .inventory-table td {
        border-bottom: 1px solid rgba(75, 88, 117, .42);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .inventory-table th {
        color: var(--muted);
        font-weight: 400;
        text-transform: uppercase;
        font-size: 10px;
      }

      .table-scroll {
        max-height: 520px;
        overflow: auto;
        border: 1px solid rgba(75, 88, 117, .45);
        border-radius: 5px;
        margin-top: 12px;
      }

      .inventory-search {
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--line2);
        border-radius: 5px;
        background: #0c1018;
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
        font-size: 12px;
      }

      .operation-list {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }

      .operation-list span {
        border: 1px solid rgba(75, 88, 117, .68);
        border-radius: 999px;
        padding: 3px 7px;
        color: var(--muted);
        background: rgba(12, 15, 23, .7);
      }

      .runtime-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .runtime-card {
        border: 1px solid rgba(75, 88, 117, .72);
        background: rgba(12, 15, 23, .78);
        border-radius: 6px;
        padding: 13px;
      }

      .runtime-card p {
        color: var(--muted);
        line-height: 1.45;
        font-size: 12px;
      }

      .freeze-lane {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .freeze-card {
        border: 1px solid rgba(75, 88, 117, .72);
        background: linear-gradient(180deg, rgba(27, 32, 46, .96), rgba(10, 12, 19, .96));
        border-radius: 7px;
        padding: 14px;
      }

      .freeze-card h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .command-list {
        display: grid;
        gap: 7px;
      }

      .command-list code {
        display: block;
        border: 1px solid rgba(75, 88, 117, .7);
        border-radius: 5px;
        padding: 8px 9px;
        background: #070a10;
        color: var(--cyan);
        overflow-wrap: anywhere;
        font-size: 11px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, .62fr);
        gap: 14px;
        margin-top: 18px;
      }

      .detail-panel {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(27, 32, 46, .96), rgba(10, 12, 19, .96));
        border-radius: 7px;
        padding: 14px;
        min-width: 0;
      }

      .detail-panel h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }

      .route-link {
        color: var(--cyan);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .status-strip {
        margin-top: 18px;
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
      }

      .status-item {
        border: 1px solid rgba(75, 88, 117, .72);
        background: rgba(12, 15, 23, .66);
        border-radius: 5px;
        padding: 10px;
      }

      .status-item span {
        color: var(--muted);
        font-size: 10px;
      }

      .status-item strong {
        display: block;
        margin-top: 6px;
        font-size: 14px;
      }

      .launch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .launch-panel {
        min-height: 110px;
        padding: 16px;
      }

      .launch-panel p,
      .rail-panel p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 1040px) {
        .topbar,
        .shell,
        .hero,
        .studio-layout,
        .widget-board,
        .scope-field,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .route-list {
          grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
        }
      }

      @media (max-width: 640px) {
        .topbar {
          position: static;
        }

        .visual,
        .visual img,
        .hero-copy {
          min-height: 320px;
        }

        .nav,
        .actions {
          justify-content: start;
        }
      }
    </style>

      routeMap.set("/mahavisphot/launch", routeMap.get("/mahavisphot/launchpad"));
      routeMap.set("/mahavisphot/launch/", routeMap.get("/mahavisphot/launchpad"));
      const moduleHeroImages = new Map(routes.filter((route) => route.heroImage).map((route) => [route.path.split("/")[2], route.heroImage]));

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function statusChip(route) {
        return `<span class="chip ${escapeHtml(route.status)}">${escapeHtml(route.status.toUpperCase())}</span>`;
      }

      function normalizePath() {
        let pathname = window.location.pathname.replace(/\/+$/, "");
        if (!pathname || pathname === "/mahavisphot/index.html") pathname = "/";
        if (pathname === "/mahavisphot") pathname = "/";
        if (pathname === "/mahavisphot/launch") pathname = "/mahavisphot/launchpad";
        return pathname;
      }

      function dynamicRouteForPath(pathname) {
        const data = scaffoldData();
        const runtimeMatch = pathname.match(/^\/mahavisphot\/runtimes\/([a-z-]+)$/);
        if (runtimeMatch) {
          const runtime = data.runtimeModes.find((item) => item.id === runtimeMatch[1]);
          if (runtime) {
            return {
              path: pathname,
              nav: runtime.id,
              title: runtime.title,
              subtitle: runtime.scope,
              status: runtime.status,
              evidence: "Runtime evidence gate",
              heroImage: `${ASSET_BASE}frame_009_neural-motion-tracker.png`,
              kind: "runtime-detail",
              runtime,
            };
          }
        }

        const workflowMatch = pathname.match(/^\/mahavisphot\/workflows\/([a-z0-9-]+)$/);
        if (workflowMatch) {
          const workflow = data.workflows.find((item) => item.id === workflowMatch[1]);
          if (workflow) {
            return {
              path: pathname,
              nav: workflow.id,
              title: workflow.title,
              subtitle: workflow.description,
              status: workflow.status,
              evidence: "Workflow scaffold",
              heroImage: `${ASSET_BASE}frame_041_timeline-stack-v3.png`,
              kind: "workflow-detail",
              workflow,
            };
          }
        }

        const crudMatch = pathname.match(/^\/mahavisphot\/crud\/([a-z0-9-]+)$/);
        if (crudMatch) {
          const crud = data.crudSurfaces.find((item) => item.id === crudMatch[1]);
          if (crud) {
            return {
              path: pathname,
              nav: crud.id,
              title: `${crud.title} CRUD`,
              subtitle: `Record operations for ${crud.title}.`,
              status: crud.status,
              evidence: "CRUD scaffold",
              heroImage: `${ASSET_BASE}frame_036_right-inspector-tabs.png`,
              kind: "crud-detail",
              crud,
            };
          }
        }

        const surface = data.uxSurfaces.find((item) => item.route === pathname);
        if (surface) {
          const moduleKey = pathname.split("/")[2];
          return {
            path: pathname,
            nav: surface.title,
            title: surface.title,
            subtitle: `${surface.group} surface for ${surface.moduleId}.`,
            status: surface.status,
            evidence: "400 UX page registry",
            heroImage: moduleHeroImages.get(moduleKey) || ALL_FRAMES_BOARD,
            kind: "ux-detail",
            surface,
          };
        }

        return null;
      }

      function currentRoute() {
        const pathname = normalizePath();
        return routeMap.get(pathname) || dynamicRouteForPath(pathname) || routeMap.get("/");
      }

      function navigate(event) {
        const link = event.target.closest("a[data-route-link]");
        if (!link) return;
        const url = new URL(link.href);
        if (url.origin !== window.location.origin || (url.pathname !== "/" && !url.pathname.startsWith("/mahavisphot"))) return;
        if (url.pathname === "/mahavisphot/launch") return;
        event.preventDefault();
        window.history.pushState({}, "", url.pathname);
        render();
      }

      function renderNav(route) {
        const topItems = ["/", "/mahavisphot/freeze-current-scaffold", "/mahavisphot/scaffolds", "/mahavisphot/compositor", "/mahavisphot/particle-studio/overview", "/mahavisphot/observatory/overview"];
        topNav.innerHTML = topItems.map((path) => {
          const item = routeMap.get(path);
          const current = item.path === route.path ? ' aria-current="page"' : "";
          return `<a href="${item.path}" data-route-link${current}>${escapeHtml(item.nav)}</a>`;
        }).join("");

        sideNav.innerHTML = routeGroups.map((group) => `
          <div class="side-title">${escapeHtml(group.label)}</div>
          ${group.routes.map((item) => {
            const current = item.path === route.path ? ' aria-current="page"' : "";
            return `<a class="route-pill" href="${item.path}" data-route-link${current}><strong>${escapeHtml(item.nav)}</strong><span aria-hidden="true"></span></a>`;
          }).join("")}
        `).join("");
      }

      function routeCards() {
        return routes.filter((route) => route.path !== "/").map((route) => `
          <a class="module-tile" href="${route.path}" data-route-link>
            <div class="module-head">
              <strong>${escapeHtml(route.title)}</strong>
              ${statusChip(route)}
            </div>
            <img src="${route.heroImage}" alt="">
            <div class="module-meta">${escapeHtml(route.group)} - ${escapeHtml(route.evidence)}</div>
          </a>
        `).join("");
      }

      function statusStrip(route) {
        return `
          <section class="status-strip" aria-label="Route status">
            <div class="status-item"><span>ROUTE</span><strong>${escapeHtml(route.path)}</strong></div>
            <div class="status-item"><span>STATUS</span><strong>${escapeHtml(route.status.toUpperCase())}</strong></div>
            <div class="status-item"><span>EVIDENCE</span><strong>${escapeHtml(route.evidence)}</strong></div>
            <div class="status-item"><span>PRODUCTION</span><strong>NO-GO</strong></div>
          </section>
        `;
      }

      function landing(route) {
        return `
          <section class="hero" aria-labelledby="route-title">
            <div class="hero-copy">
              <div>
                <h1 id="route-title">${escapeHtml(route.title)}</h1>
                <p class="subtitle">${escapeHtml(route.subtitle)}</p>
                <div class="honesty">Architecture scaffold - production readiness requires verified runtime evidence.</div>
              </div>
              <div class="hero-actions">
                <a class="button primary" href="/mahavisphot/compositor" data-route-link>Open Compositor Route</a>
                <a class="button" href="/mahavisphot/launch">Launch Studio</a>
                <a class="button" href="/mahavisphot/extracted/reference-views/index.html">Extracted Views</a>
              </div>
            </div>
            <div class="visual">
              <img src="${route.heroImage}" alt="MAHAVISPHOT Studio product board">
              <div class="visual-label"><strong>400 UX Views</strong>${statusChip(route)}</div>
            </div>
          </section>

      function routeWidgetType(route) {
        if (route.path.includes("particle")) return "particles";
        if (route.path.includes("compositor") || route.path.includes("editor")) return "timeline";
        if (route.path.includes("audio")) return "audio";
        if (route.path.includes("color") || route.path.includes("observatory")) return "scopes";
        if (route.path.includes("3d") || route.path.includes("xr")) return "spatial";
        if (route.path.includes("face") || route.path.includes("makeup")) return "face";
        if (route.path.includes("render") || route.path.includes("export")) return "render";
        if (route.path.includes("ai-mode")) return "runtime";
        return "cards";
      }

        const refs = [route.heroImage];
        if (route.path.includes("particle")) {
          refs.push(`${ASSET_BASE}frame_012_particles-gallery.png`, `${ASSET_BASE}frame_014_parametric-fields.png`);
        } else if (route.path.includes("audio")) {
          refs.push(`${ASSET_BASE}frame_019_master-mixer.png`, `${ASSET_BASE}frame_020_audio-track-mixer.png`);
        } else if (route.path.includes("color") || route.path.includes("observatory")) {
          refs.push(`${ASSET_BASE}frame_025_multi-view-scopes.png`, `${ASSET_BASE}frame_024_multi-view-color-curves.png`);
        } else if (route.path.includes("3d")) {
          refs.push(`${ASSET_BASE}frame_006_3d-transform-inspector.png`, `${ASSET_BASE}frame_007_threejs-shader-editor.png`);
        } else if (route.path.includes("face") || route.path.includes("makeup")) {
          refs.push(`${ASSET_BASE}frame_037_face-replacer-panel.png`, `${ASSET_BASE}frame_011_anisotropic-depth-map-viewer.png`);
        } else {
          refs.push(`${ASSET_BASE}frame_041_timeline-stack-v3.png`, `${ASSET_BASE}frame_042_node-graph-floating-panel.png`);
        }
        return refs.slice(0, 3);

      function bindClipDrag(clip) {
        clip.addEventListener("pointerdown", (event) => {
          const track = clip.closest(".track");
          const startX = event.clientX;
          const startLeft = Number(clip.dataset.left || 0);
          clip.setPointerCapture(event.pointerId);
          clip.style.cursor = "grabbing";

          const move = (moveEvent) => {
            const delta = ((moveEvent.clientX - startX) / track.clientWidth) * 100;
            const width = parseFloat(getComputedStyle(clip).getPropertyValue("width")) / track.clientWidth * 100;
            const nextLeft = Math.max(0, Math.min(100 - width, startLeft + delta));
            clip.dataset.left = String(nextLeft.toFixed(1));
            clip.style.setProperty("--left", `${nextLeft.toFixed(1)}%`);
            const readout = app.querySelector("#timeline-readout");
            if (readout) readout.textContent = `Clip moved to ${nextLeft.toFixed(1)}%.`;
          };

          const up = () => {
            clip.style.cursor = "grab";
            clip.removeEventListener("pointermove", move);
            clip.removeEventListener("pointerup", up);
          };

          clip.addEventListener("pointermove", move);
          clip.addEventListener("pointerup", up);
        });
      }

            labelNode.className = "mini-track-label";

            target.insertBefore(labelNode, toolbar);

            bindClipDrag(clip);
            const readout = app.querySelector("#timeline-readout");

        const search = app.querySelector("#ux-surface-search");
        const rows = [...app.querySelectorAll("[data-ux-row]")];
        if (!search || rows.length === 0) return;
        search.addEventListener("input", () => {
          const query = search.value.trim().toLowerCase();
          rows.forEach((row) => {
            row.style.display = !query || row.dataset.uxRow.includes(query) ? "" : "none";
          });
        });
      }

      function hydrateWidgets(route) {
        const type = routeWidgetType(route);
        if (type === "particles") hydrateParticles();
        if (type === "timeline") hydrateTimeline();
        if (type === "audio") hydrateAudio();
        if (type === "scopes") hydrateScopes();
        if (type === "spatial") hydrateSpatial();
        if (type === "face") hydrateFace();
        if (type === "render") hydrateRenderQueue();
        if (type === "cards") hydrateCards();
      }

      function routeHtml(route) {
        if (route.kind === "landing") return landing(route);
        if (route.kind === "launch") return launch(route);
        if (route.kind === "freeze-preview") return freezePreview(route);
        if (route.kind === "inventory") return inventoryPage(route);
        if (route.kind === "runtime-detail") return runtimeDetail(route);
        if (route.kind === "workflow-detail") return workflowDetail(route);
        if (route.kind === "crud-detail") return crudDetail(route);
        if (route.kind === "ux-detail") return uxDetail(route);
        return studio(route);
      }

      function render() {
        clearWidgetTimer();
        const route = currentRoute();
        document.title = `${route.title} - Mahavisphot Studio`;
        renderNav(route);
        app.innerHTML = routeHtml(route);
        if (route.kind === "studio" || route.kind === "ux-detail") hydrateWidgets(route);
        if (route.kind === "inventory") hydrateInventory();
        if (route.kind === "crud-detail") hydrateCrudDetail();
        app.focus({ preventScroll: true });
      }

      window.addEventListener("popstate", render);
      document.addEventListener("click", navigate);
      render();
    </script>
  </body>
</html>
